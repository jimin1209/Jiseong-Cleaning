# 지성크리닝 홍보 웹사이트 — Netlify 설정
#
# ⚠️ Netlify 사이트 설정에서 Base directory 를 `website` 로 지정해야 이 파일이 읽힙니다.
#    저장소 최상위에는 package.json 이 없어서 지정하지 않으면 빌드가 바로 실패합니다.
#
# 배포 절차는 저장소 최상위의 `Netlify 배포 설정 안내.md` 를 보세요.

[build]
  command = "npm run build"

  # ⭐ Next.js 의 배포 대상은 빌드 결과인 .next 입니다 (base 기준 상대경로).
  #
  # 이 줄이 없으면 publish 가 base(= website, 소스 폴더)로 잡히고,
  # Netlify 는 "publish 폴더 안의 파일만 배포"하므로 소스가 그대로 서빙됩니다.
  # 실제로 그렇게 배포돼서 모든 경로가 404 이고 package.json·src/*.ts 가
  # 공개로 다운로드되는 상태가 됐습니다.
  #
  # netlify.toml 은 UI 설정을 덮어쓰므로 여기에 두는 것이 확실합니다.
  publish = ".next"

[build.environment]
  # node:sqlite 와 Next 16 이 요구하는 버전. 기본값이 낮으면 빌드가 깨집니다.
  NODE_VERSION = "22"

# ⭐ Next.js 어댑터를 명시적으로 선언합니다.
#
# 공식 문서는 "자동 감지되니 선언하지 말라"고 권고하지만, 이 저장소에서는
# 자동 감지가 동작하지 않았습니다. 근거:
#   - 빌드 로그에 `❯ Plugins` 섹션이 아예 없었다
#   - 배포 결과가 .next 폴더의 정적 서빙이었다
#     (/BUILD_ID, /routes-manifest.json, /package.json 이 200 으로 열렸다)
#   - /.netlify/functions/* 가 전부 404 — 서버 함수가 만들어지지 않았다
#   그 결과 모든 페이지 경로가 404 였다.
#
# 최상위에 package.json 이 없는 구조(website/ 하위 프로젝트)라 감지가
# 걸리지 않는 것으로 보입니다. version 을 적지 않았으므로 버전 고정은 아니고,
# Netlify 가 매 빌드마다 최신 어댑터를 설치합니다.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 문의 목록에는 거래처 담당자 연락처가 들어간다.
# proxy.ts 의 Basic 인증이 1차 방어이고, 검색엔진 차단을 여기서 한 겹 더 둔다.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
